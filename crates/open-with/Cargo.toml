[package]
name = "open-with"
version = "0.1.0"
description = "The open.with cell: the opener of a ce-ref chosen by the viewer's capabilities and the openers' liveness"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "open-with"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
open-with-api = { path = "../open-with-api" }
ce-ref-text = { path = "../ce-ref-text" }
ce-net-net = { workspace = true }
ui-chain = { workspace = true }
ce-wire = { workspace = true, features = ["server", "client"] }
ce-gate = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "process"] }
serde_json = "1"
