[workspace]
resolver = "2"
members = ["crates/ce-ref-text", "crates/open-with-api", "crates/open-with"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ce-wire = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "d283bd528f96effabcf4dec56eb4fad1bec08d27" }
ce-gate = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "d283bd528f96effabcf4dec56eb4fad1bec08d27" }
ui-chain = { git = "https://github.com/ce-net/ui-cells", rev = "103703220a8554d07af1ed6a1eea5ef0e5a72090" }
ce-net-net = { git = "https://github.com/ce-net/ce-net-net", rev = "02ef21438255c89335e2299109a2846b0162c63d" }

[profile.release]
lto = "thin"
codegen-units = 16
